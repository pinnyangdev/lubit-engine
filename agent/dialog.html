<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>루빗 서버 구동기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0d1113;
      color: #eef7f4;
      font-family: system-ui, 'Malgun Gothic', 'Noto Sans KR', -apple-system, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(206, 255, 240, 0.1);
      user-select: none;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 8px 0 14px;
      background: #10161a;
      border-bottom: 1px solid rgba(206, 255, 240, 0.08);
      -webkit-app-region: drag;
    }
    header .ttl {
      flex: 1;
      font-size: 13px;
      color: #a0b3ae;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    header .close {
      -webkit-app-region: no-drag;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #6d7f7b;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
    }
    header .close:hover { background: rgba(255, 255, 255, 0.07); color: #eef7f4; }

    main { flex: 1; padding: 18px 20px 6px; overflow: auto; }
    .msg {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.5;
      word-break: keep-all;
    }
    .det {
      margin-top: 8px;
      font-size: 13px;
      color: #a0b3ae;
      line-height: 1.65;
      word-break: keep-all;
      white-space: pre-wrap;
    }
    .ic {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(255, 179, 71, 0.12);
      flex-shrink: 0;
    }
    .ic.info { background: rgba(74, 222, 128, 0.12); }

    footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 16px 16px;
      border-top: 1px solid rgba(206, 255, 240, 0.07);
      background: #0b0f11;
    }
    footer button {
      min-width: 96px;
      height: 38px;
      padding: 0 16px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    }
    footer button:active { transform: translateY(1px); }
    .ghost { background: transparent; color: #c9d8d3; border: 1px solid rgba(206, 255, 240, 0.16); }
    .ghost:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(206, 255, 240, 0.3); }
    .danger { background: #fb7185; color: #241014; border: 1px solid #fb7185; }
    .danger:hover { background: #ff879a; border-color: #ff879a; }
    .primary { background: #4ade80; color: #07231a; border: 1px solid #4ade80; }
    .primary:hover { background: #63e694; border-color: #63e694; }

    :focus-visible { outline: 2px solid rgba(255, 179, 71, 0.75); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <span class="ic" id="ic" aria-hidden="true"></span>
    <span class="ttl" id="ttl"></span>
    <button type="button" class="close" id="close" title="닫기">✕</button>
  </header>

  <main>
    <p class="msg" id="msg"></p>
    <p class="det" id="det" hidden></p>
  </main>

  <footer>
    <button type="button" class="ghost" id="cancel">취소</button>
    <button type="button" class="primary" id="ok">확인</button>
  </footer>

  <script>
    // 주소에 실려 온 문구만 그립니다. 서버 이름 같은 값은 textContent 로 넣어서
    // 태그가 그대로 노출되지 않게 합니다.
    const query = new URLSearchParams(location.search)
    const pick = (key) => query.get(key) || ''
    const tone = pick('tone') === 'warn' ? 'warn' : 'info'

    const title = pick('title') || '루빗 서버 구동기'
    document.title = title
    document.getElementById('ttl').textContent = title
    document.getElementById('msg').textContent = pick('message')

    const detail = pick('detail')
    if (detail) {
      document.getElementById('det').textContent = detail
      document.getElementById('det').hidden = false
    }

    const confirmLabel = pick('confirmLabel') || '확인'
    const ok = document.getElementById('ok')
    ok.textContent = confirmLabel
    ok.className = tone === 'warn' ? 'danger' : 'primary'

    const icon = document.getElementById('ic')
    icon.className = `ic ${tone}`
    icon.innerHTML =
      tone === 'warn'
        ? '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#ffb347" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 1.8 20.5h20.4z"/><path d="M12 9.5v4.6"/><path d="M12 17.6h.01"/></svg>'
        : '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6h.01"/></svg>'

    const answer = (value) => window.engine.dialogAnswer(value)
    ok.addEventListener('click', () => answer(true))
    document.getElementById('cancel').addEventListener('click', () => answer(false))
    document.getElementById('close').addEventListener('click', () => answer(false))
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') answer(false)
    })
    // 실수로 엔터를 쳐서 삭제되지 않도록 기본 초점은 취소에 둡니다.
    document.getElementById('cancel').focus()
  </script>
</body>
</html>
